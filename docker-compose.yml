services:
  modwatch:
    # Option A: pull pre-built image from GHCR (recommended for homelab)
    image: ghcr.io/loneangelFayt/vs-modwatch:latest
    # Option B: build locally from source (comment out image above, uncomment below)
    # build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/mods.db
      # - DISCORD_WEBHOOK_URL=
      # - APPRISE_URL=
      # - SCRAPE_INTERVAL_HOURS=6
    volumes:
      - ./data:/app/data
      # Named volume alternative (comment out bind mount above, uncomment below):
      # - modwatch_data:/app/data
    restart: unless-stopped

# volumes:
#   modwatch_data:
