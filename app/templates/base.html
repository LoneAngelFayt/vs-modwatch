<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModWatch</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1117; color: #e2e8f0; }
    header { background: #1a1d27; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid #2d3148; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header nav a { color: #94a3b8; text-decoration: none; margin-left: 1.5rem; }
    header nav a:hover { color: #e2e8f0; }
    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    .badge { display: inline-block; padding: .2rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
    .badge-client { background: #1e3a5f; color: #93c5fd; }
    .badge-server { background: #3b1f3f; color: #d8b4fe; }
    .badge-both { background: #1f3b2f; color: #6ee7b7; }
    .badge-compatible { background: #1f3b2f; color: #6ee7b7; }
    .badge-outdated { background: #3b2f0f; color: #fbbf24; }
    .badge-incompatible { background: #3b1f1f; color: #f87171; }
    .badge-unknown { background: #2d3148; color: #94a3b8; }
    .error { color: #f87171; font-size: .875rem; }
    button, .btn { cursor: pointer; border: none; border-radius: 4px; padding: .4rem .9rem; font-size: .875rem; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #2d3148; }
  </style>
</head>
<body>
  <header>
    <h1>ModWatch</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
